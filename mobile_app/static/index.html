<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BTC Portfolio">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="stylesheet" href="/static/style.css">
  <title>BTC Portfolio</title>
</head>
<body>
  <main>
    <header><div><small>₿ BTC DCA TRACKER</small><h1>My Portfolio</h1></div><div class="coin">₿</div></header>
    <section class="hero"><span>Current portfolio value</span><strong id="value">—</strong><div id="performance">Loading portfolio…</div></section>
    <section class="metrics">
      <article><span>Total invested</span><strong id="invested">—</strong></article>
      <article><span>BTC holdings</span><strong id="btc">—</strong></article>
      <article><span>BTC/CZK price</span><strong id="price">—</strong></article>
      <article><span>Average cost</span><strong id="average">—</strong></article>
    </section>
    <div class="section-title"><h2>Recent purchases</h2><button id="refresh">Refresh</button></div>
    <div id="purchases" class="purchases"></div>
    <p class="foot" id="updated">Prices refresh every 60 seconds while open.</p>
    <p class="foot">Buy-only tracker: transfers, sales, and withdrawals are not accounted for.</p>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
